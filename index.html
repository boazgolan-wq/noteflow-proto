<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<title>NoteFlow</title><link rel="icon" href="data:,"><link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#0b0820">
<link rel="stylesheet" href="css/style.css"></head><body>
<section id="menu" class="screen active"><div class="menu-in"><h1 id="appname">NoteFlow</h1><p class="sub" data-i18n="sub"></p><select id="lang" aria-label="language"></select><div id="levels"></div></div></section>
<section id="game" class="screen">
<header class="bar"><button id="back" class="ghost" data-i18n="back"></button><span id="ltitle"></span><button id="play" data-i18n="start"></button></header>
<div class="stage"><div class="hud"><div class="stat"><small data-i18n="score"></small><b id="score">0</b></div>
<div class="meter"><div id="meterfill"></div><span id="combo">0</span><small data-i18n="combo"></small></div>
<div class="stat"><small data-i18n="acc"></small><b id="acc">100%</b></div></div>
<div class="opts"><label><span data-i18n="speed"></span> <select id="speed"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option></select></label>
<button id="metro" class="ghost small" aria-pressed="true">♩ ✓</button></div>
<div id="beat"><i></i><i></i><i></i><i></i></div><div id="judge"></div></div>
<div id="kbwrap"><div id="kb" dir="ltr"></div><canvas id="fx"></canvas></div></section>
<div id="result" class="modal"><div class="card"><h2 id="rtitle"></h2><div id="stars"></div><p id="rstats"></p><button id="again" data-i18n="again"></button> <button id="tomenu" class="ghost" data-i18n="menu"></button></div></div>
<div id="premium" class="modal"><div class="card"><div class="gem">💎</div><h2 data-i18n="premTitle"></h2><p data-i18n="premText"></p><button id="pclose" data-i18n="ok"></button></div></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="js/config.js"></script><script src="js/i18n.js"></script><script src="js/audio.js"></script><script src="js/app.js"></script></body></html>
